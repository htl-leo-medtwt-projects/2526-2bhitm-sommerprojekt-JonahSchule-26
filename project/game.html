<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kart and Key - The Game</title>
    <script src="https://unpkg.com/kaboom/dist/kaboom.js"></script>
    <script src="./scripts/game.js" defer></script>
    <link rel="stylesheet" href="./styles/body-head.css">
    <link rel="stylesheet" href="./styles/hub.css">
</head>

<body>
    <section id="hub">
        <img src="./assets/img/the-hub.png" alt="The Hub" id="hub-image">

        <!-- RACES mit IDs für jedes Rennen -->
        <button type="button" class="enter-race" id="race-button-1" data-race-idx="0">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-2" data-race-idx="1">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-3" data-race-idx="2">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-4" data-race-idx="3">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-5" data-race-idx="4">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-6" data-race-idx="5">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-7" data-race-idx="6">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-8" data-race-idx="7">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-9" data-race-idx="8">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-10" data-race-idx="9">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-11" data-race-idx="10">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-12" data-race-idx="11">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-13" data-race-idx="12">Enter<br>Race</button>
        <button type="button" class="enter-race" id="race-button-14" data-race-idx="13">Enter<br>Race</button>

        <button onclick="showGarage(), playButtonClickSound()" id="goToGarage-button">Garage</button>
        <div id="lives">
    Lives left: <span id="lives-count">3</span>
</div>
        <div id="garage-power">
            <div id="power-text">Power: 0</div>
            <div id="power-bar">
                <div id="power-fill"></div>
            </div>
        </div>
        <div id="coins-amount">
            Coins: 0
        </div>
    </section>
    <section id="garage">
        <div id="upgrade-grid">
            <div id="motor" onclick="upgradeMotor()">
                <img src="./assets/img/engine-icon.png" alt="Engine Icon">
                <div id="motor-upgrade-text-box" class="upgrade-text-box">MOTOR</div>
                <div class="upgrade-bar" id="motor-bar"></div>
            </div>
            <div id="grip" onclick="upgradeGrip()">
                <img src="./assets/img/tyre.png" alt="Grip Icon">
                <div id="grip-upgrade-text-box" class="upgrade-text-box">GRIP</div>
                <div class="upgrade-bar" id="grip-bar"></div>
            </div>
            <div id="transmisson" onclick="upgradeTransmission()">
                <img src="./assets/img/manual-transmission.png" alt="Transmission Icon">
                <div id="transmission-upgrade-text-box" class="upgrade-text-box">TRANSMISSION</div>
                <div class="upgrade-bar" id="transmission-bar"></div>
            </div>
        </div>
        <div class="back-button">
            <button onclick="showHub()">Back to Hub</button>
        </div>
        <img src="./assets/img/F1-Car-Garage.png" alt="Kart" id="img-of-kart">
    </section>
    <section id="race"></section>
</body>

</html>
